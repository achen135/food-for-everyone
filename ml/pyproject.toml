[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffe-ml"
version = "0.1.0"
description = "Food For Everyone — ML subsystem: event-log corpus, feature pipeline, waste-risk model."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Kept deliberately short. The simulator itself needs no third-party maths at
# all — `random.Random` is used precisely because CPython guarantees its stream
# across versions, which numpy's default generator does not promise in the same
# terms. psycopg is the only runtime dependency M11 adds.
dependencies = [
  "psycopg[binary]>=3.2",
  # M12. numpy carries the feature matrices and the spatial index's vectorised
  # updates; scikit-learn supplies the metrics. Hand-rolling ROC-AUC and average
  # precision would save a dependency and cost the one thing an eval harness has
  # to have — being obviously correct.
  "numpy>=2.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
ffe-simulate = "ml.simulate.__main__:main"

# src layout: the import package is `ml`, so `python -m ml.simulate` works
# exactly as the milestone brief specifies. The extra directory level is what
# keeps the repo root off sys.path during tests — without it, a stray
# `import ml` could resolve against the source tree rather than the installed
# package and mask a packaging error.
[tool.setuptools.packages.find]
where = ["src"]
include = ["ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "postgres: needs a live corpus database (ML_DATABASE_URL); skipped otherwise",
  "slow: full-scale generation; skipped unless ML_RUN_SLOW=1",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
  # Assertions in the engine are internal invariants, not input validation.
  "B011",
  # Every doc in this repo — CLAUDE.md, docs/*.md, the SQL migrations — is
  # written with typographic dashes. Flagging en dashes in prose would either
  # make the ml/ comments read differently from everything around them or bury
  # the real findings under punctuation noise.
  "RUF002",
  "RUF003",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
# psycopg ships types, but the COPY cursor is duck-typed through `object` in
# the sink so a JSONL-only run never imports it. That indirection is the reason
# for the handful of `type: ignore`s there rather than a blanket relaxation.
warn_unreachable = true

# scikit-learn ships no py.typed marker, so mypy cannot see through it. The
# alternative is a hand-written stub for four metric functions, which would be
# a second thing to keep in sync with sklearn for no safety gained.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
