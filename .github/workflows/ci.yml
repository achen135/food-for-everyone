name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder values so a module-load Supabase client can't fail the
          # build. No network call is made at build time (all auth routes are
          # dynamic); real values live in Vercel project settings. See Spec §10.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Public env reached the client bundle
        # NEXT_PUBLIC_* are inlined by text substitution, so reading them
        # indirectly leaves them undefined in the browser while everything
        # server-side keeps working. Nothing else in this pipeline can see that.
        run: npm run check:client-env
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # The ml subsystem (docs/ML Subsystem.md). Separate job rather than steps in
  # `verify`: it is a different language with a different toolchain, and a
  # Python failure should read as a Python failure rather than as "CI is red".
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    services:
      # The corpus database. `ml/sql/` is plain DDL that nothing else in the
      # pipeline parses, so without a real Postgres here a syntax error in it
      # would ship — and the COPY path has already broken once in a way only an
      # actual server could show (see ml/tests/test_postgres.py).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ffe_ml
          POSTGRES_PASSWORD: ffe_ml
          POSTGRES_DB: ffe_ml
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ffe_ml -d ffe_ml"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ML_DATABASE_URL: postgresql://ffe_ml:ffe_ml@localhost:5432/ffe_ml
      ML_TEST_POSTGRES: "1"
      # The >=100k listing events / >=6 simulated months floor in §5 is a
      # definition-of-done item, so it is enforced here rather than trusted.
      # The full-scale run costs about half a minute.
      ML_RUN_SLOW: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Mypy
        run: mypy

      # The M12 definition of done: `make data && make features &&
      # eval-baselines` reproduces the committed numbers from a clean checkout.
      # Run as module invocations rather than Makefile targets, because the
      # Makefile's `db-up` brings up a compose service and CI uses a service
      # container instead.
      #
      # This runs BEFORE pytest on purpose, so the corpus exists by the time
      # `test_committed_numbers_match_a_recomputation` looks for it — otherwise
      # that test skips and the strongest check in the suite never executes.
      - name: Reproduce corpus, features and baselines
        run: |
          python -m ml.simulate --out postgres
          python -m ml.features
          python -m ml.baselines

      - name: baselines.json is byte-identical to the committed one
        run: git diff --exit-code -- baselines.json

      - name: Pytest
        run: pytest
